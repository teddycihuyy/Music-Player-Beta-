<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music</title>
<style>
:root{--bg:#070707;--card:#141414;--accent:#ff2a6d;--text:#fff;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);display:flex;justify-content:center}
.phone{width:100%;max-width:420px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
.header{padding:20px 16px 10px;display:flex;justify-content:space-between;align-items:center;z-index:30}
.header b{font-size:22px;font-weight:800}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid #222;background:#141414;display:grid;place-items:center;color:#fff;cursor:pointer}
.search{padding:8px 16px 10px;position:sticky;top:0;background:var(--bg);z-index:10}
.search-box{display:flex;gap:10px;background:#141414;border:1px solid #222;border-radius:16px;padding:14px 16px}
.search-box input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:14px}
.main{flex:1;overflow:auto;padding:0 16px 150px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{padding:9px 16px;border-radius:22px;border:1px solid #2a2a2a;background:#111;color:#888;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.active{background:#fff;color:#000}
.playlist-chips{display:flex;gap:8px;margin:8px 0 12px;overflow-x:auto;padding-bottom:4px}
.chip{padding:8px 14px;border-radius:20px;background:#1a1a1a;border:1px solid #333;color:#ccc;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.list{display:grid;gap:10px}
.song{display:flex;gap:12px;padding:12px;border-radius:18px;background:var(--card);align-items:center;cursor:pointer;border:1px solid transparent}
.song.active{border-color:var(--accent);background:#22111a}
.song img{width:56px;height:56px;border-radius:14px;background:#222;flex-shrink:0;object-fit:cover}
.song .info{flex:1;min-width:0}
.song b{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.song span{font-size:11px;color:var(--muted);margin-top:3px;display:block}
.song .more{width:32px;height:32px;border-radius:50%;background:transparent;border:0;color:#888;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.song .like{width:32px;height:32px;border-radius:50%;background:transparent;border:0;color:#666;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.song .like.liked{color:var(--accent)}
.player-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:rgba(22,22,22,0.85);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:1px solid rgba(255,255,255,.1);padding:12px 16px 18px;border-radius:24px 24px 0 0;z-index:20}
.mini-top{display:flex;gap:12px;align-items:center;cursor:pointer}
.mini-cover{width:48px;height:48px;border-radius:12px;overflow:hidden;background:#000}
.mini-cover img{width:100%;height:100%;object-fit:cover}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:0 20px}
.controls button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.controls button.play{width:58px;height:58px;background:var(--accent)}
.seek-wrap{display:flex;align-items:center;gap:10px;margin-top:10px}
.seek-wrap span{font-size:10px;color:#888;min-width:32px}
.seek-wrap span:last-child{text-align:right}
#seek,#fullSeek{flex:1;height:4px;accent-color:var(--accent);cursor:pointer}
#seek.ad,#fullSeek.ad{accent-color:#ffcc00}
#fullPlayer{position:fixed;inset:0;z-index:100;width:100%;height:100dvh;max-width:100%;left:0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,0,.67,0);overflow:hidden;background:rgba(15,15,15,0.96);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);}
#fullPlayer.show{transform:translateY(0)}
#fullBg{position:absolute;inset:0;z-index:-1;filter:blur(60px) brightness(0.5) saturate(1.2);transform:scale(1.2);opacity:0.6;background:#111}
.full-top{padding:20px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.06)}
.full-cover{margin:22px auto 18px;width:68%;max-width:300px;aspect-ratio:1;border-radius:24px;overflow:hidden;background:#111;border:1px solid rgba(255,255,255,0.1);box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08) inset}
.full-cover img{width:100%;height:100%;object-fit:cover}
.full-info{padding:14px 20px 16px;border:1px solid rgba(255,255,255,0.08);margin:0 16px;border-radius:18px;background:rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center;gap:12px}
.full-info .text{flex:1;min-width:0}
.full-info h2{font-size:16px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full-info p{font-size:13px;color:rgba(255,255,255,.6);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.like-btn{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.like-btn svg{width:24px;height:24px;display:block}
.like-btn.liked{background:#ff2a6d;border-color:#ff2a6d;color:#fff}
.like-btn.liked svg{fill:#fff;stroke:#fff}
.full-lyrics{flex:1;overflow:auto;margin:14px 16px 0;background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border-radius:18px;padding:16px;border:1px solid rgba(255,255,255,.08)}
.full-lyrics pre{white-space:pre-wrap;font-size:13px;line-height:1.7;color:#ccc;font-family:Inter,sans-serif}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;place-items:end center}
.modal.show{display:grid}
.modal#newModal{z-index:500;place-items:center center}
.sheet{width:100%;max-width:420px;background:#181818;border-radius:28px 28px 0 0;padding:20px 16px 30px;border-top:1px solid #333}
.sheet-item{padding:14px 12px;border-radius:12px;display:flex;gap:12px;align-items:center;background:transparent;border:0;color:#fff;width:100%;text-align:left;font-size:14px;cursor:pointer}
.box{width:100%;max-width:360px;background:#111;border:1px solid #333;border-radius:20px;padding:18px}
.box input{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;margin:10px 0}
.box .btn{width:100%;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:700;margin-top:8px;cursor:pointer}
.playlist-option{padding:12px;border-radius:12px;background:#1a1a1a;border:1px solid #333;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
#adBar{display:none;position:fixed;bottom:92px;left:50%;transform:translateX(-50%);width:90%;max-width:380px;background:#ffcc00;color:#000;padding:10px 14px;border-radius:14px;z-index:25;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
</style>
</head>
<body>
<div class="phone">
<div class="header"><b>Music</b><button class="icon-btn" id="newPlaylistBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div class="search"><div class="search-box"><input id="q" placeholder="Cari lagu..."><button id="go" style="background:var(--accent);border:0;color:#fff;font-weight:700;padding:7px 14px;border-radius:10px;cursor:pointer">GO</button></div></div>
<div class="main"><div class="tabs"><button class="active" data-tab="search">Search</button><button data-tab="queue">Playlist</button></div><div id="playlistChips" class="playlist-chips" style="display:none"></div><div class="list" id="result"><div style="text-align:center;color:#555;padding:40px">Cari lagu dulu</div></div></div>
<div id="adBar"><span id="adText">Iklan 0s</span><button id="skipAd" style="background:#000;color:#ffcc00;border:0;padding:6px 14px;border-radius:10px;font-weight:800;cursor:pointer">SKIP</button></div>
<div class="player-bar"><div class="mini-top" id="miniPlayer"><div class="mini-cover"><img id="cover"></div><div style="flex:1;min-width:0"><h3 id="title" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Music</h3><p id="ch" style="font-size:11px;color:#888">Pilih lagu</p></div><button class="like" id="miniLike"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6c-1.5-1.5-4-1.5-5.5 0l-1.3 1.3-1.3-1.3c-1.5-1.5-4-1.5-5.5 0-1.5 1.5-1.5 4 0 5.5l8 8 8-8c1.5-1.5 1.5-4 0-5.5z"/></svg></button></div>
<div class="seek-wrap"><span id="curTime">0:00</span><input type="range" id="seek" min="0" max="100" value="0"><span id="durTime">0:00</span></div><div class="controls"><button id="prev"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button><button class="play" id="play"><svg id="playIcon" width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M8 5.14v14l11-7z"/></svg></button><button id="next"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg></button></div></div>
</div>
<div id="fullPlayer"><div id="fullBg"></div>
<div class="full-top"><button id="closeFull" class="icon-btn" style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button><b>Now Playing</b><div style="width:40px"></div></div>
<div class="full-cover"><img id="fullCover"></div>
<div class="full-info">
  <div class="text"><h2 id="fullTitle">Music</h2><p id="fullCh">-</p></div>
  <button id="fullLike" class="like-btn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12.5c0 5-7.5 8.5-7.5 8.5S4.5 17.5 4.5 12.5c0-2.5 2-4.5 4.5-4.5 1.5 0 3 1 3 1s1.5-1 3-1c2.5 0 4.5 2 4.5 4.5z"/></svg>
  </button>
</div>
<div class="full-lyrics"><pre id="fullLyrics">Lirik tidak tersedia</pre></div>
<div style="padding:16px 20px 30px;border-top:1px solid rgba(255,255,255,.06);margin-top:14px"><div class="seek-wrap"><span id="fullCurTime">0:00</span><input type="range" id="fullSeek" min="0" max="100" value="0"><span id="fullDurTime">0:00</span></div><div class="controls"><button id="fullPrev"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button><button class="play" id="fullPlay"><svg id="fullPlayIcon" width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M8 5.14v14l11-7z"/></svg></button><button id="fullNext"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg></button></div></div>
</div>
<div class="modal" id="moreModal"><div class="sheet"><div style="width:40px;height:4px;background:#333;border-radius:10px;margin:0 auto 16px"></div><div style="display:flex;gap:12px;margin-bottom:16px"><img id="moreCover" style="width:52px;height:52px;border-radius:12px"><div><b id="moreTitle" style="font-size:14px"></b><p id="moreCh" style="font-size:11px;color:#888"></p></div></div><button class="sheet-item" id="actionPlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7z"/></svg> Putar Sekarang</button><button class="sheet-item" id="actionAdd"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> Tambah ke Playlist</button><button class="sheet-item" id="actionLike">❤️ Like / Unlike</button><button class="sheet-item" id="actionDelete" style="color:#ff5a5a;display:none">Hapus</button><button class="sheet-item" onclick="document.getElementById('moreModal').classList.remove('show')" style="color:#888">Batal</button></div></div>
<div class="modal" id="playlistModal"><div class="sheet"><h3>Pilih Playlist</h3><div id="playlistOptions" style="margin-top:12px"></div><button class="sheet-item" id="closePlaylistModal" style="color:#888">Batal</button></div></div>
<div class="modal" id="newModal"><div class="box"><h3>Buat Playlist Baru</h3><input id="newName" placeholder="Ex: Galau"><button class="btn" id="createPlaylist">Buat</button><button class="btn" id="closeNew" style="background:#222">Batal</button></div></div>
<div id="yt-player" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const API_KEY='AIzaSyCuKx7zWsOGiyegFVsS35Yr77NYtLgyY34';
let player,idx=0,tab='search',cacheResults=[],moreSong=null,moreIndex=null,moreFrom='search',playQueue=[];
let playlists=JSON.parse(localStorage.getItem('playlists')||'null')||[{id:'default',name:'My Favorites',songs:[]},{id:'liked',name:'Liked Songs',songs:[]}];
let activePlaylistId=localStorage.getItem('activePlaylistId')||'default';
if(!playlists.find(p=>p.id===activePlaylistId)) activePlaylistId=playlists[0].id;
const resultEl=document.getElementById('result');
let isDragging=false,isAdPlaying=false,hasInteracted=false;
function save(){localStorage.setItem('playlists',JSON.stringify(playlists));localStorage.setItem('activePlaylistId',activePlaylistId);}
function getActive(){return playlists.find(p=>p.id===activePlaylistId)||playlists[0];}
function getLiked(){return playlists.find(p=>p.id==='liked')||playlists[0];}
function isLiked(id){return getLiked().songs.some(s=>s.id===id);}
function toggleLike(song){
  const liked=getLiked();
  const i=liked.songs.findIndex(s=>s.id===song.id);
  if(i>=0) liked.songs.splice(i,1); else liked.songs.push(song);
  save(); updateLikeUI(); if(tab==='queue' && activePlaylistId==='liked') renderQueue(); renderChips();
}
function updateLikeUI(){
  const cur=playQueue[idx];
  const liked=cur?isLiked(cur.id):false;
  const btn=document.getElementById('fullLike');
  btn.classList.toggle('liked',liked);
  btn.innerHTML=liked
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.35-8.5-7.5C1.5 10.5 4 6.5 8.5 7.5c2 .5 3.5 2 3.5 3.5 0-1.5 1.5-3 3.5-3.5 4.5-1 7 3 5 6.5C19 16.65 12 21 12 21z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12.5c0 5-7.5 8.5-7.5 8.5S4.5 17.5 4.5 12.5c0-2.5 2-4.5 4.5-4.5 1.5 0 3 1 3 1s1.5-1 3-1c2.5 0 4.5 2 4.5 4.5z"/></svg>';
  document.getElementById('miniLike').style.color=liked?'#ff2a6d':'#666';
  }
function renderChips(){const c=document.getElementById('playlistChips');c.innerHTML='';playlists.forEach(pl=>{const d=document.createElement('div');d.className='chip'+(pl.id===activePlaylistId?' active':'');d.textContent=pl.name+' ('+pl.songs.length+')';d.onclick=()=>{activePlaylistId=pl.id;save();renderChips();if(tab==='queue')renderQueue();};c.appendChild(d);});}
function formatTime(s){s=Math.floor(s||0);const m=Math.floor(s/60);const sec=s%60;return m+":"+(sec<10?"0"+sec:sec);}
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt-player',{height:'1',width:'1',videoId:'',playerVars:{playsinline:1,origin:location.origin},events:{
    onReady:()=>{
      player.setVolume(80);
      setInterval(()=>{
        if(!player || !player.getDuration || isDragging) return;
        try{
          const cur=player.getCurrentTime()||0;
          const dur=player.getDuration()||0;
          if(dur>0){
            const pct=(cur/dur)*100;
            document.getElementById('seek').value=pct;
            document.getElementById('fullSeek').value=pct;
            document.getElementById('curTime').textContent=formatTime(cur);
            document.getElementById('fullCurTime').textContent=formatTime(cur);
            document.getElementById('durTime').textContent=formatTime(dur);
            document.getElementById('fullDurTime').textContent=formatTime(dur);
            const data=player.getVideoData();
            const isAd = dur>0 && dur<45 && data.video_id && !playQueue.some(s=>s.id===data.video_id);
            if(isAd){
              if(!isAdPlaying){isAdPlaying=true;document.getElementById('adBar').style.display='flex';document.getElementById('seek').classList.add('ad');}
              document.getElementById('adText').textContent="Iklan • "+Math.max(0,Math.floor(dur-cur))+"s lagi";
            }else{
              if(isAdPlaying){isAdPlaying=false;document.getElementById('adBar').style.display='none';document.getElementById('seek').classList.remove('ad');}
            }
          }
        }catch(e){}
      },500);
    },
    onStateChange:e=>{
      const playing=e.data==1;
      document.getElementById('playIcon').innerHTML=playing?'<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>':'<path d="M8 5.14v14l11-7z"/>';
      document.getElementById('fullPlayIcon').innerHTML=document.getElementById('playIcon').innerHTML;
      if(e.data==0) next();
      if(e.data==1){isAdPlaying=false;document.getElementById('adBar').style.display='none';}
    },
    onError:e=>{next();}
  }});
  renderChips();
}
function setupSeek(el){
  el.addEventListener('input',()=>{isDragging=true;});
  el.addEventListener('change',()=>{
    const pct=parseFloat(el.value);
    if(player && player.getDuration){
      const dur=player.getDuration();
      player.seekTo((pct/100)*dur,true);
    }
    isDragging=false;
  });
}
setupSeek(document.getElementById('seek'));
setupSeek(document.getElementById('fullSeek'));
function renderSearch(items){cacheResults=items;resultEl.innerHTML='';items.forEach((s,i)=>{const d=document.createElement('div');d.className='song';const liked=isLiked(s.id);d.innerHTML=`<img loading="lazy" src="https://img.youtube.com/vi/${s.id}/mqdefault.jpg"><div class="info"><b>${s.title}</b><span>${s.ch}</span></div><button class="like ${liked?'liked':''}" data-like="${i}" data-from="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6c-1.5-1.5-4-1.5-5.5 0l-1.3 1.3-1.3-1.3c-1.5-1.5-4-1.5-5.5 0-1.5 1.5-1.5 4 0 5.5l8 8 8-8c1.5-1.5 1.5-4 0-5.5z"/></svg></button><button class="more" data-more="${i}" data-from="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="1.5"/><circle cx="19.5" cy="12" r="1.5"/><circle cx="4.5" cy="12" r="1.5"/></svg></button>`;d.addEventListener('click',(e)=>{if(e.target.closest('.more')||e.target.closest('.like'))return;playQueue=cacheResults;idx=i;playFromQueue();});resultEl.appendChild(d);});document.getElementById('playlistChips').style.display='none';}
function renderQueue(){const pl=getActive();resultEl.innerHTML='';if(!pl.songs.length)resultEl.innerHTML=`<div style="text-align:center;color:#555;padding:40px">Playlist ${pl.name} kosong</div>`;else pl.songs.forEach((s,i)=>{const d=document.createElement('div');d.className='song'+(playQueue===pl.songs&&i==idx?' active':'');const liked=isLiked(s.id);d.innerHTML=`<img src="https://img.youtube.com/vi/${s.id}/mqdefault.jpg"><div class="info"><b>${s.title}</b><span>${s.ch}</span></div><button class="like ${liked?'liked':''}" data-like="${i}" data-from="queue"><svg width="18" height="18" viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6c-1.5-1.5-4-1.5-5.5 0l-1.3 1.3-1.3-1.3c-1.5-1.5-4-1.5-5.5 0-1.5 1.5-1.5 4 0 5.5l8 8 8-8c1.5-1.5 1.5-4 0-5.5z"/></svg></button><button class="more" data-more="${i}" data-from="queue"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="1.5"/><circle cx="19.5" cy="12" r="1.5"/><circle cx="4.5" cy="12" r="1.5"/></svg></button>`;d.addEventListener('click',(e)=>{if(e.target.closest('.more')||e.target.closest('.like'))return;playQueue=pl.songs;idx=i;playFromQueue();});resultEl.appendChild(d);});document.getElementById('playlistChips').style.display='flex';renderChips();}
resultEl.addEventListener('click',e=>{
  const likeBtn=e.target.closest('.like');
  if(likeBtn){const i=+likeBtn.dataset.like;const from=likeBtn.dataset.from;const song=from==='search'?cacheResults[i]:getActive().songs[i];toggleLike(song); if(from==='search') renderSearch(cacheResults); else renderQueue(); return;}
  const btn=e.target.closest('.more');if(!btn)return;const i=+btn.dataset.more;const from=btn.dataset.from;moreFrom=from;moreIndex=i;moreSong=from==='search'?cacheResults[i]:getActive().songs[i];document.getElementById('moreCover').src=`https://img.youtube.com/vi/${moreSong.id}/mqdefault.jpg`;document.getElementById('moreTitle').textContent=moreSong.title;document.getElementById('moreCh').textContent=moreSong.ch;document.getElementById('actionDelete').style.display=from==='queue'?'flex':'none';document.getElementById('moreModal').classList.add('show');});
document.getElementById('actionPlay').onclick=()=>{document.getElementById('moreModal').classList.remove('show');playQueue=moreFrom==='search'?cacheResults:getActive().songs;idx=moreIndex;playFromQueue();};
document.getElementById('actionAdd').onclick=()=>{document.getElementById('moreModal').classList.remove('show');showPlaylistPicker();};
document.getElementById('actionLike').onclick=()=>{toggleLike(moreSong);document.getElementById('moreModal').classList.remove('show');if(tab==='search') renderSearch(cacheResults); else renderQueue();};
document.getElementById('actionDelete').onclick=()=>{getActive().songs.splice(moreIndex,1);save();renderQueue();document.getElementById('moreModal').classList.remove('show');};
function showPlaylistPicker(){const opt=document.getElementById('playlistOptions');opt.innerHTML='';playlists.forEach(pl=>{if(pl.id==='liked')return;const d=document.createElement('div');d.className='playlist-option';d.innerHTML=`<span>${pl.name}</span><span>${pl.songs.length}</span>`;d.onclick=()=>{if(!pl.songs.some(s=>s.id===moreSong.id))pl.songs.push(moreSong);save();renderChips();document.getElementById('playlistModal').classList.remove('show');if(activePlaylistId===pl.id)renderQueue();};opt.appendChild(d);});document.getElementById('playlistModal').classList.add('show');}
document.getElementById('closePlaylistModal').onclick=()=>document.getElementById('playlistModal').classList.remove('show');
document.getElementById('newPlaylistBtn').onclick=()=>{document.getElementById('newModal').classList.add('show');document.getElementById('newModal').style.display='grid';setTimeout(()=>document.getElementById('newName').focus(),100);};
document.getElementById('closeNew').onclick=()=>{document.getElementById('newModal').classList.remove('show');document.getElementById('newModal').style.display='none';};
document.getElementById('newModal').onclick=e=>{if(e.target.id==='newModal'){e.target.classList.remove('show');e.target.style.display='none';}};
document.getElementById('createPlaylist').onclick=()=>{const name=document.getElementById('newName').value.trim();if(!name)return;const id=Date.now().toString();playlists.push({id,name,songs:[]});activePlaylistId=id;save();renderChips();renderQueue();document.getElementById('newName').value='';document.getElementById('newModal').classList.remove('show');document.getElementById('newModal').style.display='none';tab='queue';document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelector('[data-tab=queue]').classList.add('active');};
function playFromQueue(){
  const s=playQueue[idx];
  document.getElementById('title').textContent=s.title;
  document.getElementById('ch').textContent=s.ch;
  document.getElementById('cover').src=`https://img.youtube.com/vi/${s.id}/mqdefault.jpg`;
  document.getElementById('fullTitle').textContent=s.title;
  document.getElementById('fullCh').textContent=s.ch;
  document.getElementById('fullCover').src=`https://img.youtube.com/vi/${s.id}/mqdefault.jpg`;
  document.getElementById('fullBg').style.background=`url(https://img.youtube.com/vi/${s.id}/mqdefault.jpg) center/cover`;
  document.getElementById('fullLyrics').textContent="Lirik tidak tersedia";
  updateLikeUI();
  if(player && player.loadVideoById){
    if(!hasInteracted){player.mute();player.loadVideoById(s.id);setTimeout(()=>{player.unMute();player.setVolume(80);},800);hasInteracted=true;}else{player.loadVideoById(s.id);}
  }
}
function next(){if(playQueue.length){idx=(idx+1)%playQueue.length;playFromQueue();}}
function prev(){if(playQueue.length){idx=(idx-1+playQueue.length)%playQueue.length;playFromQueue();}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
document.getElementById('fullNext').onclick=next;document.getElementById('fullPrev').onclick=prev;
document.getElementById('play').onclick=()=>{if(!player)return;const st=player.getPlayerState();if(st==1)player.pauseVideo();else player.playVideo();};
document.getElementById('fullPlay').onclick=()=>{if(!player)return;const st=player.getPlayerState();if(st==1)player.pauseVideo();else player.playVideo();};
document.getElementById('fullLike').onclick=()=>{const cur=playQueue[idx];if(cur) toggleLike(cur);};
document.getElementById('miniLike').onclick=(e)=>{e.stopPropagation();const cur=playQueue[idx];if(cur) toggleLike(cur); if(tab==='search') renderSearch(cacheResults); else renderQueue();};
document.getElementById('skipAd').onclick=()=>{try{const d=player.getDuration();player.seekTo(d,true);setTimeout(()=>{if(playQueue[idx])player.loadVideoById(playQueue[idx].id);},500);}catch(e){}document.getElementById('adBar').style.display='none';isAdPlaying=false;};
async function search(q){if(!q)return;resultEl.innerHTML='<div style="padding:20px;color:#888">Searching...</div>';try{const res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&q=${encodeURIComponent(q)}&key=${API_KEY}`);const data=await res.json();if(data.error)throw new Error(data.error.message);const items=data.items.map(it=>({id:it.id.videoId,title:it.snippet.title,ch:it.snippet.channelTitle}));renderSearch(items);tab='search';document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.querySelector('[data-tab=search]').classList.add('active');}catch(e){resultEl.innerHTML=`<div style="color:#ff5a5a;padding:20px">Error: ${e.message}</div>`;}}
document.getElementById('go').onclick=()=>search(document.getElementById('q').value);
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search(e.target.value);});
document.querySelectorAll('.tabs button').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');tab=btn.dataset.tab;if(tab==='search'){if(cacheResults.length)renderSearch(cacheResults);else resultEl.innerHTML='<div style="padding:20px;color:#555">Cari dulu</div>';}else renderQueue();};});
document.getElementById('miniPlayer').onclick=()=>{document.getElementById('fullPlayer').classList.add('show');};
document.getElementById('closeFull').onclick=()=>{document.getElementById('fullPlayer').classList.remove('show');};
document.body.addEventListener('click',()=>{if(!hasInteracted && player && player.playVideo){hasInteracted=true;player.mute();player.playVideo();setTimeout(()=>{player.unMute();player.setVolume(80);},600);}}, {once:true});
</script>
</body>
</html>
