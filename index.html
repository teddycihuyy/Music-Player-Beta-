<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music</title>
<style>
:root{--bg:#070707;--card:#141414;--accent:#ff2a6d;--text:#fff;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);display:flex;justify-content:center}
.phone{width:100%;max-width:420px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
.header{padding:20px 16px 10px;display:flex;justify-content:space-between;align-items:center;z-index:30}
.header b{font-size:22px;font-weight:800}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid #222;background:#141414;display:grid;place-items:center;color:#fff;cursor:pointer}
.search{padding:8px 16px 10px;position:sticky;top:0;background:var(--bg);z-index:10}
.search-box{display:flex;gap:10px;background:#141414;border:1px solid #222;border-radius:16px;padding:14px 16px}
.search-box input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:14px}
.main{flex:1;overflow:auto;padding:0 16px 150px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{padding:9px 16px;border-radius:22px;border:1px solid #2a2a2a;background:#111;color:#888;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.active{background:#fff;color:#000}
.playlist-chips{display:flex;gap:8px;margin:8px 0 12px;overflow-x:auto;padding-bottom:4px}
.chip{padding:8px 14px;border-radius:20px;background:#1a1a1a;border:1px solid #333;color:#ccc;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.list{display:grid;gap:10px}
.song{display:flex;gap:12px;padding:12px;border-radius:18px;background:var(--card);align-items:center;cursor:pointer;border:1px solid transparent}
.song.active{border-color:var(--accent);background:#22111a}
.song img{width:56px;height:56px;border-radius:14px;background:#222;flex-shrink:0;object-fit:cover}
.song .info{flex:1;min-width:0}
.song b{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.song span{font-size:11px;color:var(--muted);margin-top:3px;display:block}
.song .more{width:32px;height:32px;border-radius:50%;background:transparent;border:0;color:#888;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.player-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:rgba(22,22,22,0.75);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:1px solid rgba(255,255,255,.1);padding:12px 16px 18px;border-radius:24px 24px 0 0;z-index:20}
.mini-top{display:flex;gap:12px;align-items:center;cursor:pointer}
.mini-cover{width:48px;height:48px;border-radius:12px;overflow:hidden;background:#000}
.mini-cover img{width:100%;height:100%;object-fit:cover}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:0 20px}
.controls button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.controls button.play{width:58px;height:58px;background:var(--accent)}
.seek-wrap{display:flex;align-items:center;gap:10px;margin-top:10px}
.seek-wrap span{font-size:10px;color:#888;min-width:32px}
.seek-wrap span:last-child{text-align:right}
#seek,#fullSeek{flex:1;height:4px;accent-color:var(--accent);cursor:pointer}
#seek.ad,#fullSeek.ad{accent-color:#ffcc00}
#fullPlayer{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;max-width:420px;left:50%;transform:translateX(-50%) translateY(100%);transition:transform .5s cubic-bezier(.32,0,.67,0);overflow:hidden;background:rgba(20,20,20,0.65);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,0.08)}
#fullPlayer.show{transform:translateX(-50%) translateY(0)}
#fullBg{position:absolute;inset:0;z-index:-1;filter:blur(50px) brightness(0.6) saturate(1.4);transform:scale(1.3);opacity:0.8;background:#111}
.full-top{padding:20px 16px;display:flex;justify-content:space-between;align-items:center}
.full-cover{margin:18px 24px;aspect-ratio:1;border-radius:32px;overflow:hidden;background:#111;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1) inset}
.full-cover img{width:100%;height:100%;object-fit:cover}
.full-info{display:flex;justify-content:space-between;align-items:center;padding:0 24px;margin-top:14px}
.full-lyrics{flex:1;overflow:auto;margin:16px 20px 0;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-radius:24px;padding:18px;border:1px solid rgba(255,255,255,.12)}
.full-lyrics pre{white-space:pre-wrap;font-size:14px;line-height:1.8;color:#eee;font-family:Inter,sans-serif}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;place-items:end center}
.modal.show{display:grid}
.modal#newModal{z-index:500;place-items:center center}
.sheet{width:100%;max-width:420px;background:#181818;border-radius:28px 28px 0 0;padding:20px 16px 30px;border-top:1px solid #333}
.sheet-item{padding:14px 12px;border-radius:12px;display:flex;gap:12px;align-items:center;background:transparent;border:0;color:#fff;width:100%;text-align:left;font-size:14px;cursor:pointer}
.box{width:100%;max-width:360px;background:#111;border:1px solid #333;border-radius:20px;padding:18px}
.box input{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;margin:10px 0}
.box .btn{width:100%;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:700;margin-top:8px;cursor:pointer}
.playlist-option{padding:12px;border-radius:12px;background:#1a1a1a;border:1px solid #333;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
#adBar{display:none;position:fixed;bottom:92px;left:50%;transform:translateX(-50%);width:90%;max-width:380px;background:#ffcc00;color:#000;padding:10px 14px;border-radius:14px;z-index:25;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
</style>
</head>
<body>
<div class="phone">
<div class="header"><b>Music</b><button class="icon-btn" id="newPlaylistBtn">+</button></div>
<div class="search"><div class="search-box"><input id="q" placeholder="Cari lagu..."><button id="go" style="background:var(--accent);border:0;color:#fff;font-weight:700;padding:7px 14px;border-radius:10px">GO</button></div></div>
<div class="main"><div class="tabs"><button class="active" data-tab="search">Search</button><button data-tab="queue">Playlist</button></div><div id="playlistChips" class="playlist-chips" style="display:none"></div><div class="list" id="result"><div style="text-align:center;color:#555;padding:40px">Cari lagu dulu</div></div></div>
<div id="adBar"><span id="adText">Iklan 0s</span><button id="skipAd" style="background:#000;color:#ffcc00;border:0;padding:6px 14px;border-radius:10px;font-weight:800">SKIP</button></div>
<div class="player-bar"><div class="mini-top" id="miniPlayer"><div class="mini-cover"><img id="cover"></div><div style="flex:1;min-width:0"><h3 id="title" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Music</h3><p id="ch" style="font-size:11px;color:#888">Pilih lagu</p></div></div><div class="seek-wrap"><span id="curTime">0:00</span><input type="range" id="seek" min="0" max="100" value="0"><span id="durTime">0:00</span></div><div class="controls"><button id="prev">⏮</button><button class="play" id="play">▶</button><button id="next">⏭</button></div></div>
                                                                                                                                                                                                                                                                                                                                                                                    </div>
<div id="fullPlayer"><div id="fullBg"></div>
<div class="full-top"><button id="closeFull" class="icon-btn" style="background:rgba(255,255,255,.12)">X</button><b>Now Playing</b><div style="width:40px"></div></div>
<div class="full-cover"><img id="fullCover"></div>
<div class="full-info"><div style="min-width:0;flex:1"><h2 id="fullTitle" style="font-size:20px">Music</h2><p id="fullCh" style="font-size:13px;color:rgba(255,255,255,.7)">-</p></div></div>
<div class="full-lyrics"><pre id="fullLyrics">Klik lagu...</pre></div>
<div style="padding:16px 24px 30px"><div class="seek-wrap"><span id="fullCurTime">0:00</span><input type="range" id="fullSeek" min="0" max="100" value="0"><span id="fullDurTime">0:00</span></div><div class="controls"><button id="fullPrev">⏮</button><button class="play" id="fullPlay">▶</button><button id="fullNext">⏭</button></div></div>
</div>
<div class="modal" id="moreModal"><div class="sheet"><div id="moreTitle"></div><button id="actionPlay">Putar</button><button id="actionAdd">Tambah Playlist</button><button id="actionDelete">Hapus</button></div></div>
<div class="modal" id="playlistModal"><div class="sheet"><div id="playlistOptions"></div><button id="closePlaylistModal">Batal</button></div></div>
<div class="modal" id="newModal"><div class="box"><input id="newName" placeholder="Nama playlist"><button id="createPlaylist">Buat</button><button id="closeNew">Batal</button></div></div>
<div id="yt-player" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const API_KEY='AIzaSyCuKx7zWsOGiyegFVsS35Yr77NYtLgyY34';
let player,idx=0,tab='search',cacheResults=[],moreSong=null,moreIndex=null,moreFrom='search',playQueue=[];
let playlists=JSON.parse(localStorage.getItem('playlists')||'null')||[{id:'default',name:'My Favorites',songs:[]}];
let activePlaylistId=localStorage.getItem('activePlaylistId')||'default';
const resultEl=document.getElementById('result');
let isDragging = false;
let isAdPlaying = false;
function save(){localStorage.setItem('playlists',JSON.stringify(playlists));localStorage.setItem('activePlaylistId',activePlaylistId);}
function getActive(){return playlists.find(p=>p.id===activePlaylistId)||playlists[0];}
function renderChips(){const c=document.getElementById('playlistChips');c.innerHTML='';playlists.forEach(pl=>{const d=document.createElement('div');d.className='chip'+(pl.id===activePlaylistId?' active':'');d.textContent=pl.name+' ('+pl.songs.length+')';d.onclick=()=>{activePlaylistId=pl.id;save();renderChips();if(tab==='queue')renderQueue();};c.appendChild(d);});}
function formatTime(s){s=Math.floor(s||0);const m=Math.floor(s/60);const sec=s%60;return m+":"+(sec<10?"0"+sec:sec);}
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt-player',{height:'1',width:'1',videoId:'',playerVars:{playsinline:1},events:{
    onReady:()=>{
      player.setVolume(80);
      setInterval(()=>{
        if(!player || !player.getDuration || isDragging) return;
        try{
          const cur=player.getCurrentTime()||0;
          const dur=player.getDuration()||0;
          if(dur>0){
            const pct=(cur/dur)*100;
            document.getElementById('seek').value=pct;
            document.getElementById('fullSeek').value=pct;
            document.getElementById('curTime').textContent=formatTime(cur);
            document.getElementById('fullCurTime').textContent=formatTime(cur);
            document.getElementById('durTime').textContent=formatTime(dur);
            document.getElementById('fullDurTime').textContent=formatTime(dur);
            const data=player.getVideoData();
            const isAd = dur>0 && dur<45 && !playQueue.some(s=>s.id===data.video_id);
            if(isAd){
              if(!isAdPlaying){isAdPlaying=true;document.getElementById('adBar').style.display='flex';document.getElementById('seek').classList.add('ad');}
              document.getElementById('adText').textContent="Iklan • "+Math.max(0,Math.floor(dur-cur))+"s lagi";
            }else{
              if(isAdPlaying){isAdPlaying=false;document.getElementById('adBar').style.display='none';document.getElementById('seek').classList.remove('ad');}
            }
          }
        }catch(e){}
      },500);
    },
    onStateChange:e=>{
      const playing=e.data==1;
      document.getElementById('play').textContent=playing?'⏸':'▶';
      document.getElementById('fullPlay').textContent=playing?'⏸':'▶';
      if(e.data==0) next();
      if(e.data==1){isAdPlaying=false;document.getElementById('adBar').style.display='none';}
    }
  }});
  renderChips();
}
function setupSeek(el){
  el.addEventListener('input',()=>{isDragging=true;});
  el.addEventListener('change',()=>{
    const pct=parseFloat(el.value);
    if(player && player.getDuration){
      const dur=player.getDuration();
      player.seekTo((pct/100)*dur,true);
    }
    isDragging=false;
  });
}
setupSeek(document.getElementById('seek'));
setupSeek(document.getElementById('fullSeek'));
function renderSearch(items){cacheResults=items;resultEl.innerHTML='';items.forEach((s,i)=>{const d=document.createElement('div');d.className='song';d.innerHTML=`<img src="https://img.youtube.com/vi/${s.id}/mqdefault.jpg"><div class="info"><b>${s.title}</b><span>${s.ch}</span></div>`;d.addEventListener('click',()=>{playQueue=cacheResults;idx=i;playFromQueue();});resultEl.appendChild(d);});document.getElementById('playlistChips').style.display='none';}
function renderQueue(){const pl=getActive();resultEl.innerHTML='';if(!pl.songs.length)resultEl.innerHTML=`<div style="text-align:center;color:#555;padding:40px">Playlist ${pl.name} kosong</div>`;else pl.songs.forEach((s,i)=>{const d=document.createElement('div');d.className='song';d.innerHTML=`<img src="https://img.youtube.com/vi/${s.id}/mqdefault.jpg"><div class="info"><b>${s.title}</b><span>${s.ch}</span></div>`;d.addEventListener('click',()=>{playQueue=pl.songs;idx=i;playFromQueue();});resultEl.appendChild(d);});document.getElementById('playlistChips').style.display='flex';renderChips();}
function playFromQueue(){const s=playQueue[idx];document.getElementById('title').textContent=s.title;document.getElementById('ch').textContent=s.ch;document.getElementById('cover').src=`https://img.youtube.com/vi/${s.id}/mqdefault.jpg`;document.getElementById('fullTitle').textContent=s.title;document.getElementById('fullCh').textContent=s.ch;document.getElementById('fullCover').src=`https://img.youtube.com/vi/${s.id}/mqdefault.jpg`;document.getElementById('fullBg').style.background=`url(https://img.youtube.com/vi/${s.id}/mqdefault.jpg) center/cover`;if(player&&player.loadVideoById)player.loadVideoById(s.id);}
function next(){if(playQueue.length){idx=(idx+1)%playQueue.length;playFromQueue();}}
function prev(){if(playQueue.length){idx=(idx-1+playQueue.length)%playQueue.length;playFromQueue();}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
document.getElementById('fullNext').onclick=next;document.getElementById('fullPrev').onclick=prev;
document.getElementById('play').onclick=()=>{if(!player)return;const st=player.getPlayerState();if(st==1)player.pauseVideo();else player.playVideo();};
document.getElementById('fullPlay').onclick=()=>{if(!player)return;const st=player.getPlayerState();if(st==1)player.pauseVideo();else player.playVideo();};
document.getElementById('skipAd').onclick=()=>{try{const d=player.getDuration();player.seekTo(d,true);setTimeout(()=>{if(playQueue[idx])player.loadVideoById(playQueue[idx].id);},500);}catch(e){}document.getElementById('adBar').style.display='none';isAdPlaying=false;};
async function search(q){if(!q)return;resultEl.innerHTML='<div style="padding:20px;color:#888">Searching...</div>';try{const res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&q=${encodeURIComponent(q)}&key=${API_KEY}`);const data=await res.json();const items=data.items.map(it=>({id:it.id.videoId,title:it.snippet.title,ch:it.snippet.channelTitle}));renderSearch(items);tab='search';}catch(e){resultEl.innerHTML=`<div style="color:#ff5a5a;padding:20px">Error: ${e.message}</div>`;}}
document.getElementById('go').onclick=()=>search(document.getElementById('q').value);
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search(e.target.value);});
document.querySelectorAll('.tabs button').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');tab=btn.dataset.tab;if(tab==='search'){if(cacheResults.length)renderSearch(cacheResults);else resultEl.innerHTML='<div style="padding:20px;color:#555">Cari dulu</div>';}else renderQueue();};});
document.getElementById('miniPlayer').onclick=()=>{document.getElementById('fullPlayer').classList.add('show');};
document.getElementById('closeFull').onclick=()=>{document.getElementById('fullPlayer').classList.remove('show');};
document.getElementById('newPlaylistBtn').onclick=()=>{document.getElementById('newModal').classList.add('show');document.getElementById('newModal').style.display='grid';};
document.getElementById('closeNew').onclick=()=>{document.getElementById('newModal').classList.remove('show');document.getElementById('newModal').style.display='none';};
document.getElementById('createPlaylist').onclick=()=>{const name=document.getElementById('newName').value.trim();if(!name)return;const id=Date.now().toString();playlists.push({id,name,songs:[]});activePlaylistId=id;save();renderChips();renderQueue();document.getElementById('newName').value='';document.getElementById('newModal').classList.remove('show');document.getElementById('newModal').style.display='none';};
</script>
</body>
</html>
