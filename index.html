<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music - NO ADS</title>
<style>
  :root {
    --bg: #070707;
    --card: #141414;
    --accent: #ff2a6d;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, sans-serif; }
  body { background: var(--bg); color: #fff; display: flex; justify-content: center; }
  .phone { width: 100%; max-width: 420px; min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; }
  .header { padding: 20px 16px 10px; display: flex; justify-content: space-between; }
  .header b { font-size: 22px; font-weight: 800; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid #222; background: #141414; display: grid; place-items: center; color: #fff; }
  .search { padding: 8px 16px 10px; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .search-box { display: flex; gap: 10px; background: #141414; border: 1px solid #222; border-radius: 16px; padding: 14px 16px; }
  .search-box input { flex: 1; background: transparent; border: 0; color: #fff; outline: none; }

  .main { flex: 1; overflow: auto; padding: 0 16px 150px; }
  .tabs { display: flex; gap: 8px; margin: 12px 0; }
  .tabs button { padding: 9px 16px; border-radius: 22px; border: 1px solid #2a2a2a; background: #111; color: #888; }
  .tabs button.active { background: #fff; color: #000; }

  .list { display: grid; gap: 10px; }
  .song { display: flex; gap: 12px; padding: 12px; border-radius: 18px; background: var(--card); align-items: center; }
  .song img { width: 56px; height: 56px; border-radius: 14px; }
  .song .info { flex: 1; min-width: 0; }
  .song b { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .song span { font-size: 11px; color: #888; }

  /* LIKE BUTTON - FIX KEPOTONG */
  .like, #miniLike, .like-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    color: #fff;
    display: grid; place-items: center;
    overflow: visible; /* biar gak kepotong */
  }
  .like svg, #miniLike svg, .like-btn svg {
    width: 22px; height: 22px;
    display: block;
    overflow: visible;
  }
  .like.liked, #miniLike.liked, .like-btn.liked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .like.liked svg, #miniLike.liked svg, .like-btn.liked svg {
    fill: #fff; stroke: #fff;
  }

  /* PLAYER BAR */
  .player-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 420px;
    background: rgba(22,22,22,0.92);
    backdrop-filter: blur(30px);
    border-top: 1px solid rgba(255,255,255,.1);
    padding: 12px 16px 18px;
    border-radius: 24px 24px 0 0;
  }
  .mini-top { display: flex; gap: 12px; align-items: center; }
  .mini-cover { width: 48px; height: 48px; border-radius: 12px; overflow: hidden; background: #000; }
  .mini-cover img { width: 100%; height: 100%; object-fit: cover; }

  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding: 0 20px; }
  .controls button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: #fff; display: grid; place-items: center; }
  .controls button.play { width: 58px; height: 58px; background: var(--accent); }
  .controls button svg { width: 22px; height: 22px; }

  .seek-wrap { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .seek-wrap span { font-size: 10px; color: #888; min-width: 32px; }
  #seek, #fullSeek { flex: 1; height: 4px; accent-color: var(--accent); }

  /* FULL PLAYER - 100% LAYAR */
  #fullPlayer {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform .45s;
    background: rgba(15,15,15,0.96);
    backdrop-filter: blur(40px);
  }
  #fullPlayer.show { transform: translateY(0); }
  #fullBg { position: absolute; inset: 0; z-index: -1; filter: blur(60px) brightness(0.5); opacity: 0.6; }
  .full-top { padding: 20px 16px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.06); }
  .full-cover { margin: 22px auto 18px; width: 68%; max-width: 300px; aspect-ratio: 1; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); }
  .full-cover img { width: 100%; height: 100%; object-fit: cover; }
  .full-info { padding: 14px 20px; border: 1px solid rgba(255,255,255,.08); margin: 0 16px; border-radius: 18px; background: rgba(255,255,255,.05); display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <b>Music</b>
    <button class="icon-btn" id="newPlaylistBtn">+</button>
  </div>

  <div class="search">
    <div class="search-box">
      <input id="q" placeholder="Cari lagu...">
      <button id="go" style="background:var(--accent);border:0;color:#fff;padding:7px 14px;border-radius:10px;">GO</button>
    </div>
  </div>

  <div class="main">
    <div class="tabs">
      <button class="active" data-tab="search">Search</button>
      <button data-tab="queue">Playlist</button>
    </div>
    <div id="playlistChips" class="playlist-chips" style="display:none"></div>
    <div class="list" id="result">
      <div style="text-align:center;color:#555;padding:40px">Cari lagu dulu - NO ADS</div>
    </div>
  </div>

  <div class="player-bar">
    <div class="mini-top" id="miniPlayer">
      <div class="mini-cover"><img id="cover"></div>
      <div style="flex:1;min-width:0">
        <h3 id="title" style="font-size:13px;">Music</h3>
        <p id="ch" style="font-size:11px;color:#888">Pilih lagu</p>
      </div>
      <button id="miniLike">
        <!-- HEART ICON - GAK KEPOTONG -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2.08C10.5 3.5 9.5 3 7.75 3A5.5 5.5 0 0 0 2.25 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        </svg>
      </button>
    </div>
    <div class="seek-wrap">
      <span id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0">
      <span id="durTime">0:00</span>
    </div>
    <div class="controls">
      <button id="prev">
        <!-- PREV SVG -->
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play" id="play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="white"><path d="M8 5.14v14l11-7z"/></svg>
      </button>
      <button id="next">
        <!-- NEXT SVG -->
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>
  </div>
  <div id="fullPlayer">
  <div id="fullBg"></div>
  <div class="full-top">
    <button id="closeFull" class="icon-btn">✕</button>
    <b>Now Playing • NO ADS</b>
    <div style="width:40px"></div>
  </div>

  <div class="full-cover"><img id="fullCover"></div>

  <div class="full-info">
    <div class="text">
      <h2 id="fullTitle">Music</h2>
      <p id="fullCh">-</p>
    </div>
    <button id="fullLike" class="like-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2.08C10.5 3.5 9.5 3 7.75 3A5.5 5.5 0 0 0 2.25 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      </svg>
    </button>
  </div>

  <div class="full-lyrics" style="flex:1;overflow:auto;margin:14px 16px 0;background:rgba(255,255,255,0.04);border-radius:18px;padding:16px;border:1px solid rgba(255,255,255,.08);">
    <pre id="fullLyrics">NO ADS MODE - Piped API</pre>
  </div>

  <div style="padding:16px 20px 30px;border-top:1px solid rgba(255,255,255,.06);margin-top:14px">
    <div class="seek-wrap">
      <span id="fullCurTime">0:00</span>
      <input type="range" id="fullSeek" min="0" max="100" value="0">
      <span id="fullDurTime">0:00</span>
    </div>
    <div class="controls">
      <button id="fullPrev">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play" id="fullPlay">
        <svg id="fullPlayIcon" viewBox="0 0 24 24" fill="white"><path d="M8 5.14v14l11-7z"/></svg>
      </button>
      <button id="fullNext">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="moreModal" style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;place-items:end center;">
  <div class="sheet" style="width:100%;max-width:420px;background:#181818;border-radius:28px 28px 0 0;padding:20px 16px 30px;">
    <div id="moreTitle"></div>
    <button class="sheet-item" id="actionPlay">▶ Putar</button>
    <button class="sheet-item" id="actionAdd">＋ Playlist</button>
    <button class="sheet-item" id="actionLike">❤️ Like</button>
  </div>
</div>

<audio id="audioPlayer" style="display:none" crossorigin="anonymous"></audio>

<script>
// NO ADS - PIPED API
let idx=0, playQueue=[], cacheResults=[];
let playlists = JSON.parse(localStorage.getItem('playlists')||'null') || [{id:'default',name:'My Favorites',songs:[]},{id:'liked',name:'Liked Songs',songs:[]}];
const audio = document.getElementById('audioPlayer');
const resultEl = document.getElementById('result');

function heartOutline(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2.08C10.5 3.5 9.5 3 7.75 3A5.5 5.5 0 0 0 2.25 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
}
function heartFilled(){
  return `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2.08C10.5 3.5 9.5 3 7.75 3A5.5 5.5 0 0 0 2.25 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
}

// SEARCH NO ADS
async function search(q){
  resultEl.innerHTML = '<div style="padding:20px;color:#888">Searching NO ADS...</div>';
  const res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q)}&filter=music_songs`);
  const data = await res.json();
  const items = data.items.slice(0,12).map(it=>{
    const vid = it.url.split('v=')[1] || it.url.split('/').pop();
    return {id:vid, title:it.title, ch:it.uploaderName};
  });
  cacheResults = items;
  resultEl.innerHTML = '';
  items.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'song';
    d.innerHTML = `<img src="https://img.youtube.com/vi/${s.id}/mqdefault.jpg"><div class="info"><b>${s.title}</b><span>${s.ch}</span></div><button class="like">${heartOutline()}</button>`;
    d.onclick = ()=>{ playQueue = cacheResults; idx = i; playFromQueue(); };
    resultEl.appendChild(d);
  });
}

// PLAY NO ADS
async function playFromQueue(){
  const s = playQueue[idx];
  document.getElementById('title').textContent = s.title;
  document.getElementById('fullTitle').textContent = s.title;
  document.getElementById('fullCh').textContent = s.ch;
  document.getElementById('cover').src = `https://img.youtube.com/vi/${s.id}/mqdefault.jpg`;
  document.getElementById('fullCover').src = `https://img.youtube.com/vi/${s.id}/mqdefault.jpg`;
  document.getElementById('fullBg').style.background = `url(https://img.youtube.com/vi/${s.id}/mqdefault.jpg) center/cover`;
  
  const res = await fetch(`https://pipedapi.kavin.rocks/streams/${s.id}`);
  const data = await res.json();
  let audioUrl = data.audioStreams.sort((a,b)=>b.bitrate-a.bitrate)[0].url;
  audio.src = audioUrl;
  audio.play();
}

function next(){ idx = (idx+1)%playQueue.length; playFromQueue(); }
function prev(){ idx = (idx-1+playQueue.length)%playQueue.length; playFromQueue(); }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('fullNext').onclick = next;
document.getElementById('fullPrev').onclick = prev;
document.getElementById('play').onclick = ()=> audio.paused ? audio.play() : audio.pause();
document.getElementById('fullPlay').onclick = ()=> audio.paused ? audio.play() : audio.pause();
document.getElementById('go').onclick = ()=> search(document.getElementById('q').value);
document.getElementById('miniPlayer').onclick = ()=> document.getElementById('fullPlayer').classList.add('show');
document.getElementById('closeFull').onclick = ()=> document.getElementById('fullPlayer').classList.remove('show');

audio.addEventListener('timeupdate', ()=>{
  const cur = audio.currentTime||0;
  const dur = audio.duration||0;
  if(dur>0){
    const pct = (cur/dur)*100;
    document.getElementById('seek').value = pct;
    document.getElementById('fullSeek').value = pct;
  }
});
audio.addEventListener('ended', ()=> next());
</script>
</body>
      </html>
